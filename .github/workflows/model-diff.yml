name: Model diff
on:
  pull_request:
    paths: ["**/*.archimate"]
  push:
    branches: [main]
    paths: ["**/*.archimate"]

permissions:
  contents: read
  pull-requests: write

jobs:
  diff:
    runs-on: ubuntu-latest
    env:
      MODEL: model.archimate   # adjust to the actual path in your repo
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Build summaries
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            OLD=${{ github.event.pull_request.base.sha }}
            NEW=${{ github.event.pull_request.head.sha }}
          else
            OLD=${{ github.event.before }}
            NEW=${{ github.sha }}
          fi
          git show "$OLD:$MODEL" > old.archimate 2>/dev/null || echo '<archimate:model xmlns:archimate="http://www.archimatetool.com/archimate"/>' > old.archimate
          git show "$NEW:$MODEL" > new.archimate
          python3 tools/summarize_archimate.py old.archimate > old.txt
          python3 tools/summarize_archimate.py new.archimate > new.txt
          diff -u old.txt new.txt > model.diff || true
          { echo '### Model changes'; echo '```diff'; head -c 60000 model.diff; echo '```'; } > body.md

      - name: Job summary
        run: cat body.md >> "$GITHUB_STEP_SUMMARY"

      - name: PR comment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh pr comment ${{ github.event.pull_request.number }} --body-file body.md --edit-last --create-if-none
